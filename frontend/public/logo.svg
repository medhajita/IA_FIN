<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" width="240" height="52" fill="none">
  <defs>
    <!-- Icon gradient: blue → purple diagonal -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a6dff"/>
      <stop offset="100%" stop-color="#6e7bf2"/>
    </linearGradient>
    <!-- Text gradient: horizontal blue → purple -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a6dff"/>
      <stop offset="100%" stop-color="#6e7bf2"/>
    </linearGradient>
    <!-- Soft glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .fin-text { fill: #0b1220; }
    .tagline   { fill: #5b6678; }
    @media (prefers-color-scheme: dark) {
      .fin-text { fill: #ffffff; }
      .tagline   { fill: #3d4a5e; }
    }
  </style>

  <!-- ── ICON BACKGROUND ── -->
  <rect x="0" y="4" width="44" height="44" rx="13" fill="url(#iconGrad)"/>

  <!-- Subtle inner shine -->
  <rect x="0" y="4" width="44" height="22" rx="13" fill="white" opacity="0.07"/>

  <!-- ── BAR CHART (3 ascending bars) ── -->
  <!-- Bar 1 – short -->
  <rect x="7" y="30" width="7.5" height="12" rx="2.5" fill="white" opacity="0.65"/>
  <!-- Bar 2 – medium -->
  <rect x="18" y="21" width="7.5" height="21" rx="2.5" fill="white" opacity="0.82"/>
  <!-- Bar 3 – tall -->
  <rect x="29" y="13" width="7.5" height="29" rx="2.5" fill="white" opacity="1"/>

  <!-- ── TREND LINE + ARROW ── -->
  <polyline
    points="10.75,28  21.75,19  32.75,11"
    stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
    opacity="0.95"/>
  <!-- Arrow head at top right -->
  <polyline
    points="27.5,9  32.75,11  31,16"
    stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
    opacity="0.95"/>

  <!-- ── WORDMARK ── -->
  <!-- "Fin" — bold, dark/white depending on theme -->
  <text
    x="54" y="31"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif"
    font-size="23" font-weight="700" letter-spacing="-0.3"
    class="fin-text">Fin</text>

  <!-- "Coach" — bold, gradient -->
  <text
    x="84" y="31"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif"
    font-size="23" font-weight="700" letter-spacing="-0.3"
    fill="url(#textGrad)">Coach</text>

  <!-- Tagline -->
  <text
    x="54" y="43"
    font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
    font-size="7.5" font-weight="500" letter-spacing="1.5"
    class="tagline">PERSONAL FINANCE WITH AI</text>
</svg>
