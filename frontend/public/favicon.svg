<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a6dff"/>
      <stop offset="100%" stop-color="#6e7bf2"/>
    </linearGradient>
  </defs>

  <!-- Background square -->
  <rect width="48" height="48" rx="13" fill="url(#g)"/>

  <!-- Inner shine -->
  <rect width="48" height="24" rx="13" fill="white" opacity="0.08"/>

  <!-- Bar 1 – short -->
  <rect x="7" y="30" width="8" height="13" rx="2.5" fill="white" opacity="0.65"/>
  <!-- Bar 2 – medium -->
  <rect x="19" y="21" width="8" height="22" rx="2.5" fill="white" opacity="0.82"/>
  <!-- Bar 3 – tall -->
  <rect x="31" y="13" width="8" height="30" rx="2.5" fill="white"/>

  <!-- Trend line -->
  <polyline points="11,28 23,19 35,11"
    stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <!-- Arrow head -->
  <polyline points="29.5,9 35,11 33,16.5"
    stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
</svg>
